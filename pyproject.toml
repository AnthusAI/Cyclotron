[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-flywheel"
version = "0.6.0"
description = "Model-neutral decision context optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8"]
tools = [
    "build>=1.2",
    "kanbus==0.33.0",
    "python-semantic-release>=10,<11",
]
jev = ["typesafe-sdk>=0.7,<0.8", "python-dotenv>=1,<2"]
laya = ["laya"]
kev = ["httpx>=0.27"]
retrieval = ["numpy>=1.26"]
openai-embeddings = ["openai>=1.40", "python-dotenv>=1,<2"]
reviewer = ["rich>=13,<15", "huggingface_hub>=0.24,<2", "requests>=2.31,<3"]

[project.scripts]
decision-flywheel-demo = "decision_flywheel.demo:main"
decision-flywheel-review = "decision_flywheel.reviewer:main"

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/decision_flywheel/__init__.py:__version__"]
build_command = "python -m build"
upload_to_pypi = false
upload_to_vcs_release = true
allow_zero_version = true
major_on_zero = false
changelog_file = "CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["*_test.py"]
