[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-flywheel"
version = "0.31.0"
description = "Model-neutral decision context optimization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["decision-flywheel[reviewer,accounts,accounts-cloud,priming]", "ruff>=0.15.5,<0.16", "pytest>=8", "pytest-bdd>=8,<9", "fastapi>=0.115,<1", "strawberry-graphql[fastapi]>=0.280,<1", "httpx>=0.27,<1"]
tools = [
    "build>=1.2",
    "kanbus==0.33.0",
    "python-semantic-release>=10,<11",
]
jev = ["typesafe-sdk>=0.7,<0.8", "python-dotenv>=1,<2"]
optimizer = ["openai>=1.40,<3", "python-dotenv>=1,<2"]
litellm-optimizer = ["litellm>=1.81,<2", "python-dotenv>=1,<2"]
laya = ["laya"]
kev = ["httpx>=0.27"]
foundry = ["httpx>=0.27"]
retrieval = ["numpy>=1.26"]
openai-embeddings = ["openai>=1.40", "python-dotenv>=1,<2"]
reviewer = ["rich>=13,<15", "huggingface_hub>=0.24,<2", "requests>=2.31,<3"]
web = ["decision-flywheel[priming]", "fastapi>=0.115,<1", "strawberry-graphql[fastapi]>=0.280,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]
priming = ["jsonschema>=4.23,<5", "openpyxl>=3.1,<4", "httpx>=0.27,<1"]
accounts = ["decision-flywheel[web]", "botocore>=1.43,<2", "strawberry-graphql[fastapi]>=0.332,<1", "PyJWT[crypto]>=2.10,<3"]

accounts-cloud = ["decision-flywheel[accounts,priming]", "mangum==0.19.0"]

[project.scripts]
decision-flywheel-demo = "decision_flywheel.demo:main"
decision-flywheel-review = "decision_flywheel.reviewer:main"
decision-flywheel-web = "decision_flywheel.web_server:main"

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/decision_flywheel/__init__.py:__version__"]
build_command = "python -m build"
upload_to_pypi = false
upload_to_vcs_release = true
allow_zero_version = true
major_on_zero = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decision_flywheel = ["vendor/vis-timeline/*.txt", "vendor/vis-timeline/*.md", "vendor/vis-timeline/styles/*.css", "vendor/vis-timeline/standalone/umd/*.js", "vendor/trace-ui/*.js", "vendor/trace-ui/*.css", "vendor/trace-ui/*.txt", "schemas/*.json"]

[tool.ruff]
line-length = 130
extend-exclude = ["src/decision_flywheel/vendor"]

[tool.ruff.format]
exclude = [
    "conftest.py",
    "src/decision_flywheel/__init__.py",
    "src/decision_flywheel/held_out_service.py",
    "src/decision_flywheel/held_out_service_test.py",
    "src/decision_flywheel/held_out_test.py",
    "src/decision_flywheel/hosted_runtime.py",
    "src/decision_flywheel/hosted_runtime_test.py",
    "src/decision_flywheel/web_api.py",
    "src/decision_flywheel/web_api_test.py",
    "src/decision_flywheel/application_runtime.py",
    "src/decision_flywheel/application_runtime_test.py",
    "src/decision_flywheel/web_worker.py",
    "src/decision_flywheel/web_worker_test.py",
]

[tool.ruff.lint]
select = ["F", "B", "UP", "I"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["B017", "B023"]
"src/decision_flywheel/__init__.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/held_out_service.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/held_out_service_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/held_out_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/hosted_runtime.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/hosted_runtime_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/web_api.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/web_api_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/application_runtime.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/application_runtime_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/web_worker.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/web_worker_test.py" = ["F", "B", "UP", "I"]
"src/decision_flywheel/account_routes_test.py" = ["F401", "F811"]
"scripts/*" = ["B023"]
"src/decision_flywheel/batch_storage.py" = ["B023"]
"src/decision_flywheel/context.py" = ["B023"]
"src/decision_flywheel/matched_run_evaluation.py" = ["B023"]
"src/decision_flywheel/replay.py" = ["B023"]

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
python_files = ["*_test.py"]
markers = ["slow: long replay, study and editorial-corpus tests; make test skips them, make test-all and make check run them"]
